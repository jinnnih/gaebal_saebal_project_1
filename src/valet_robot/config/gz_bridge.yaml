# ===========================================================================
# ros_gz_bridge 설정 — Gazebo Harmonic <-> ROS 2
#   /clock 은 parking_lot_world/launch/parking_world.launch.py 가 이미 브리지한다.
# ===========================================================================

# 2D 라이다 : AMCL(scan_topic: scan) / costmap obstacle_layer(/scan)
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# 전방 RGBD — 영상은 대시보드용, 포인트클라우드는 costmap obstacle_layer 용
- ros_topic_name: "/front_cam/image"
  gz_topic_name: "/front_cam/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/front_cam/camera_info"
  gz_topic_name: "/front_cam/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ! gz 쪽 타입은 PointCloudPacked 다. PointCloud 로 적으면 조용히 안 붙는다.
- ros_topic_name: "/front_cam/points"
  gz_topic_name: "/front_cam/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# IMU (선택 — robot_localization 확장 시 사용)
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# 오도메트리 토픽 : Nav2 bt_navigator/velocity_smoother 의 odom_topic
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint TF
- ros_topic_name: "/tf"
  gz_topic_name: "/tf_gz"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
