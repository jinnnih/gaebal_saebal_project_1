# ===========================================================================
# valet_car ros2_control 구성 (ROS 2 Jazzy)
#   이 파일은 URDF 의 gz_ros2_control 플러그인 <parameters> 로 로드된다.
#   즉 controller_manager 는 Gazebo 프로세스 안에서 돈다.
# ===========================================================================
controller_manager:
  ros__parameters:
    update_rate: 100          # Hz. Nav2 controller_frequency(20) 보다 충분히 빠르게
    use_sim_time: true

    # gz_ros2_control 이 position 명령을 P 제어(위치오차 -> 속도명령)로 푸는 게인.
    # URDF 플러그인 태그에도 같은 값을 넣어 두었다(버전에 따라 읽는 위치가 다름).
    position_proportional_gain: 12.0

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

# ---------------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

# ---------------------------------------------------------------------------
# Ackermann 조향 컨트롤러
#   입력  : /ackermann_steering_controller/reference  (geometry_msgs/TwistStamped)
#           twist_to_ackermann 노드가 /cmd_vel 을 여기로 변환해 넣는다.
#   출력  : 뒷바퀴 velocity 명령 + 앞바퀴 steer position 명령
#           (좌/우 조향각을 Ackermann 기하로 다르게 계산 -> 내륜차 반영)
# ---------------------------------------------------------------------------
ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true

    front_steering: true          # 앞 조향 / 뒤 구동
    open_loop: false
    position_feedback: false      # 구동 조인트는 velocity 상태만 사용
    use_stamped_vel: true
    reference_timeout: 0.5        # 명령이 끊기면 0.5 s 뒤 정지
    velocity_rolling_window_size: 10

    # Jazzy 최신 steering_controllers_library 파라미터명.
    # front_wheels_names / rear_wheels_names / *_wheel_track / *_wheels_radius 는
    # DEPRECATED 경고가 뜬다 (실행 로그로 확인함).
    traction_joints_names: [rear_left_wheel_joint,  rear_right_wheel_joint]
    steering_joints_names: [front_left_steer_joint, front_right_steer_joint]

    # 기구학 제원 — URDF(common.xacro) 및 parking_lot_world 와 반드시 일치
    wheelbase: 2.50
    traction_track_width: 1.38
    steering_track_width: 1.38
    traction_wheels_radius: 0.33

    # 조향각이 목표에 도달할 때까지 구동륜 속도를 줄인다.
    # 후진 주차(3주차)에서 정차 오차를 줄이는 데 쓸 수 있는 튜닝 지점.
    reduce_wheel_speed_until_steering_reached: false

    # ! 이 컨트롤러의 오도메트리는 "후륜축" 원점 자전거 모델이다.
    #   이 로봇의 base_link 는 차체 중심(후륜축 +1.25 m)이라 그대로 TF 로 쓰면
    #   odom -> base_footprint 가 어긋난다. 그래서 TF 는 끄고 토픽만 남긴다.
    #   실제 odom TF 는 Gazebo OdometryPublisher 플러그인이 base_footprint 기준으로 낸다.
    #   (sensors.gazebo.xacro 참고)
    odom_frame_id: odom
    base_frame_id: base_rear_axle
    enable_odom_tf: false

    pose_covariance_diagonal:  [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0,   0.0, 0.0, 0.0, 0.01]
